name: Samadhan Setu CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test, Lint and Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samadhan
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: samadhan_setu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samadhan -d samadhan_setu_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://samadhan:test-only-password@localhost:5432/samadhan_setu_test?schema=public
      TEST_DATABASE_URL: postgresql://samadhan:test-only-password@localhost:5432/samadhan_setu_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SESSION_SECRET: test-only-session-secret-that-is-long-enough

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        id: prisma_validate
        continue-on-error: true
        run: npx --no-install prisma validate

      - name: Generate Prisma client
        id: prisma_generate
        continue-on-error: true
        run: npx --no-install prisma generate

      - name: Apply migrations to the test database
        id: prisma_migrate
        continue-on-error: true
        run: npx --no-install prisma migrate deploy

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: npx --no-install tsc --noEmit

      - name: Run Vitest unit and PostgreSQL integration tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build Next.js Production Bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Fail if a required verification step failed
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.prisma_validate.outcome }}
          GENERATE_OUTCOME: ${{ steps.prisma_generate.outcome }}
          MIGRATE_OUTCOME: ${{ steps.prisma_migrate.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          failed=0
          for result in "$VALIDATE_OUTCOME" "$GENERATE_OUTCOME" "$MIGRATE_OUTCOME" "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME"; do
            if [ "$result" != "success" ]; then
              echo "Required verification failed or did not run: $result"
              failed=1
            fi
          done
          exit "$failed"
